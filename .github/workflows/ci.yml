name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  docs-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Workspace prepare scripts build Anta, stickers, Plot, and the TypeDoc theme on install.
      - name: Install dependencies and build workspace
        run: pnpm install --frozen-lockfile
      - name: Check documentation authors
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'review-docs') }}
        run: |
          if [ "$DOCS_REVIEWED" = true ]; then
            node scripts/check-doc-review.mjs --base "$DOCS_BASE_SHA" --review-docs
          else
            node scripts/check-doc-review.mjs --base "$DOCS_BASE_SHA"
          fi

  build:
    runs-on: ubuntu-latest
    env:
      ANTA_TEST_WEBKIT: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select component tests
        id: component-tests
        env:
          TEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$TEST_BASE_SHA" ]; then
            echo 'calendar=true' >> "$GITHUB_OUTPUT"
            echo 'card=true' >> "$GITHUB_OUTPUT"
            echo 'text=true' >> "$GITHUB_OUTPUT"
            echo 'progress=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/components/Calendar.*' 'src/components/InputDate.*' \
            'src/components/Input.*' 'src/components/InputTime.*' \
            'src/components/Button.*' 'src/components/Menu*' \
            'src/components/Tooltip.*' 'src/components/Icon.*' \
            'src/elements/a-calendar.*' 'src/elements/a-input*' \
            'src/elements/a-button.*' 'src/elements/a-menu*' \
            'src/elements/a-tooltip.*' 'src/elements/a-icon*' \
            src/{calendar-core,jsx-runtime,anta_helpers,general_types,index}.ts \
            src/elements/{index,key-activation,shadow-aria,focus,copy-behavior}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            tests/calendar-controlled.mjs .github/workflows/ci.yml \
            package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'calendar=true' >> "$GITHUB_OUTPUT"
          else
            echo 'calendar=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-card.*' \
            src/components/Card.tsx src/components/Title.tsx src/components/Text.tsx src/components/Icon.tsx \
            'src/elements/a-title.*' 'src/elements/a-text.*' 'src/elements/a-icon*' \
            src/{jsx-runtime,anta_helpers,general_types,index,bundle}.ts src/elements/index.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/card-csp*' scripts/build-bundle.mjs .github/workflows/ci.yml \
            package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'card=true' >> "$GITHUB_OUTPUT"
          else
            echo 'card=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-text.*' 'src/elements/a-button.*' 'src/elements/a-tooltip.*' \
            src/components/{Text,Tooltip}.tsx \
            src/{jsx-runtime,anta_helpers,general_types,index,bundle}.ts \
            src/elements/{index,key-activation}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/text-csp*' scripts/build-bundle.mjs .github/workflows/ci.yml \
            package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'text=true' >> "$GITHUB_OUTPUT"
          else
            echo 'text=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-progress.*' src/components/Progress.tsx \
            src/{jsx-runtime,anta_helpers,general_types,index,bundle}.ts src/elements/index.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/progress-csp*' scripts/build-bundle.mjs .github/workflows/ci.yml \
            package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'progress=true' >> "$GITHUB_OUTPUT"
          else
            echo 'progress=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Workspace prepare scripts build Anta, stickers, Plot, and the TypeDoc theme on install.
      - name: Install dependencies and build workspace
        run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Run tests
        run: pnpm test
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
          # The debounce case races the browser clock during setup.
          NODE_OPTIONS: >-
            --test-skip-pattern="^debounces typing, keeps previous matches, and shows activity only in the input$"
      - name: Test Calendar and InputDate
        if: steps.component-tests.outputs.calendar == 'true'
        run: pnpm test:calendar
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
      - name: Test Card CSP and initial layout
        if: steps.component-tests.outputs.card == 'true'
        run: pnpm test:card
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
      - name: Test Text CSP, expansion, and initial layout
        if: steps.component-tests.outputs.text == 'true'
        run: pnpm test:text
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
      - name: Test Progress CSP and initial layout
        if: steps.component-tests.outputs.progress == 'true'
        run: pnpm test:progress
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
      - name: Typecheck stickers
        run: pnpm --filter @antadesign/stickers run typecheck
      - name: Typecheck plot
        run: pnpm --filter @antadesign/plot run typecheck
      - name: Verify plot package
        run: pnpm --filter @antadesign/plot run check:package
      - name: Verify TypeDoc theme package
        run: pnpm --filter @antadesign/typedoc-theme exec npm pack --dry-run
      - name: Lint site CSS
        run: pnpm --filter anta-site run lint:css
      - name: Typecheck search worker
        run: pnpm --filter anta-site run typecheck:worker
      - name: Build site
        run: pnpm --filter anta-site build
      - name: Test production site
        run: pnpm --filter anta-site test:production
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
