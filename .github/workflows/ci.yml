name: CI
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Run tests
        run: pnpm test
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
      - name: Build stickers
        run: pnpm --filter @antadesign/stickers run build
      - name: Typecheck stickers
        run: pnpm --filter @antadesign/stickers run typecheck
      - name: Build plot
        run: pnpm --filter @antadesign/plot run build
      - name: Typecheck plot
        run: pnpm --filter @antadesign/plot run typecheck
      - name: Verify plot package
        run: pnpm --filter @antadesign/plot run check:package
      - name: Lint site CSS
        run: pnpm --filter anta-site run lint:css
      - name: Typecheck search worker
        run: pnpm --filter anta-site run typecheck:worker
      - name: Build site
        run: pnpm --filter anta-site build
      - name: Test production search rendering
        run: pnpm --filter anta-site test:search-production
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
