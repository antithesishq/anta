name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

jobs:
  docs-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Workspace prepare scripts build Anta, stickers, Plot, and the TypeDoc theme on install.
      - name: Install dependencies and build workspace
        run: pnpm install --frozen-lockfile
      - name: Check documentation authors
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'review-docs') }}
        run: |
          if [ "$DOCS_REVIEWED" = true ]; then
            node scripts/check-doc-review.mjs --base "$DOCS_BASE_SHA" --review-docs
          else
            node scripts/check-doc-review.mjs --base "$DOCS_BASE_SHA"
          fi

  build:
    runs-on: ubuntu-latest
    env:
      ANTA_TEST_WEBKIT: '0'
      ANTA_COMPONENT_TEST_TIER: ${{ github.event_name == 'workflow_dispatch' && 'slow' || 'fast' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select component tests
        id: component-tests
        env:
          TEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$TEST_BASE_SHA" ]; then
            echo 'menu=true' >> "$GITHUB_OUTPUT"
            echo 'copy=true' >> "$GITHUB_OUTPUT"
            echo 'calendar=true' >> "$GITHUB_OUTPUT"
            echo 'card=true' >> "$GITHUB_OUTPUT"
            echo 'text=true' >> "$GITHUB_OUTPUT"
            echo 'progress=true' >> "$GITHUB_OUTPUT"
            echo 'expander=true' >> "$GITHUB_OUTPUT"
            echo 'banner=true' >> "$GITHUB_OUTPUT"
            echo 'input-time=true' >> "$GITHUB_OUTPUT"
            echo 'input=true' >> "$GITHUB_OUTPUT"
            echo 'toaster=true' >> "$GITHUB_OUTPUT"
            echo 'tooltip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-menu*' 'src/elements/a-input*' 'src/elements/a-button.*' 'src/elements/a-tooltip.*' 'src/elements/a-copy.*' \
            src/elements/{index,focus,key-activation,shadow-aria,copy-behavior}.ts \
            src/components/{Menu,MenuItem,MenuItemCopy,Input,InputAutocomplete,InputDate,InputTime,Select,SelectFaceted,Breadcrumbs,Button,Tooltip}.tsx src/components/copy-props.ts \
            src/{jsx-runtime,native-event-props,anta_helpers,general_types,index,bundle}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/menu-*' tests/native-event-props.test.mjs tests/consumers/templates/nextjs/package.json \
            scripts/build-bundle.mjs .github/workflows/{ci,component-tests}.yml \
            'tests/component*.mjs' package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'menu=true' >> "$GITHUB_OUTPUT"
          else
            echo 'menu=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-copy.*' 'src/elements/a-button.*' 'src/elements/a-menu*' 'src/elements/a-icon*' \
            src/elements/{copy-behavior,key-activation,index}.ts \
            src/components/{ButtonCopy,MenuItemCopy,Button,Menu,MenuItem}.tsx src/components/copy-props.ts \
            src/{jsx-runtime,native-event-props,anta_helpers,general_types,index,bundle}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/copy-*' tests/native-event-props.test.mjs tests/consumers/templates/nextjs/package.json \
            scripts/build-bundle.mjs .github/workflows/{ci,component-tests}.yml \
            'tests/component*.mjs' package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'copy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'copy=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/components/Calendar.*' 'src/components/InputDate.*' \
            'src/components/Input.*' 'src/components/InputTime.*' \
            'src/components/Button.*' 'src/components/Menu*' \
            'src/components/Tooltip.*' 'src/components/Icon.*' \
            'src/elements/a-calendar.*' 'src/elements/a-input*' \
            'src/elements/a-button.*' 'src/elements/a-menu*' \
            'src/elements/a-tooltip.*' 'src/elements/a-icon*' \
            src/{calendar-core,jsx-runtime,native-event-props,input-events,anta_helpers,general_types,index}.ts \
            src/elements/{index,key-activation,shadow-aria,focus,copy-behavior,input-focus-modality,input-trailing-actions}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            tests/calendar-controlled.mjs .github/workflows/ci.yml \
            'tests/component*.mjs' package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'calendar=true' >> "$GITHUB_OUTPUT"
          else
            echo 'calendar=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-card.*' \
            src/components/Card.tsx src/components/Title.tsx src/components/Text.tsx src/components/Icon.tsx \
            'src/elements/a-title.*' 'src/elements/a-text.*' 'src/elements/a-icon*' \
            src/{jsx-runtime,native-event-props,anta_helpers,general_types,index,bundle}.ts src/elements/index.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/card-csp*' scripts/build-bundle.mjs .github/workflows/ci.yml \
            'tests/component*.mjs' package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'card=true' >> "$GITHUB_OUTPUT"
          else
            echo 'card=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-text.*' 'src/elements/a-button.*' 'src/elements/a-tooltip.*' \
            src/components/{Text,Tooltip}.tsx \
            src/{jsx-runtime,native-event-props,anta_helpers,general_types,index,bundle}.ts \
            src/elements/{index,key-activation}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/text-csp*' scripts/build-bundle.mjs .github/workflows/ci.yml \
            'tests/component*.mjs' package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'text=true' >> "$GITHUB_OUTPUT"
          else
            echo 'text=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-progress*' src/components/Progress.tsx \
            src/{jsx-runtime,native-event-props,anta_helpers,general_types,index,bundle}.ts src/elements/index.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/progress-csp*' scripts/build-bundle.mjs .github/workflows/ci.yml \
            'tests/component*.mjs' package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'progress=true' >> "$GITHUB_OUTPUT"
          else
            echo 'progress=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-banner.*' 'src/elements/a-button.*' 'src/elements/a-icon*' \
            src/components/{Banner,Button,Icon}.tsx \
            src/{jsx-runtime,native-event-props,anta_helpers,general_types,index,bundle}.ts \
            src/elements/{index,key-activation}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/banner-csp*' tests/banner-package.mjs tests/consumers/templates/nextjs/package.json \
            scripts/build-bundle.mjs .github/workflows/ci.yml \
            'tests/component*.mjs' package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'banner=true' >> "$GITHUB_OUTPUT"
          else
            echo 'banner=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-expander.*' 'src/elements/a-button.*' 'src/elements/a-icon*' \
            src/components/{Expander,Button,Icon}.tsx \
            src/{jsx-runtime,native-event-props,anta_helpers,general_types,index,bundle}.ts src/elements/{index,key-activation}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/expander-*' tests/consumers/templates/nextjs/package.json \
            scripts/build-bundle.mjs .github/workflows/{ci,component-tests}.yml \
            'tests/component*.mjs' package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'expander=true' >> "$GITHUB_OUTPUT"
          else
            echo 'expander=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-tooltip.*' 'src/elements/a-text.*' 'src/elements/a-button.*' \
            'src/elements/a-menu*' 'src/elements/a-input*' 'src/elements/a-tab*' \
            src/components/{Tooltip,Text,Button,Steps,Tabs,Select,SelectFaceted,Menu,MenuItem,Input}.tsx \
            src/{jsx-runtime,native-event-props,input-events,anta_helpers,general_types,index,bundle}.ts \
            src/elements/{index,key-activation,shadow-aria,input-focus-modality,input-trailing-actions}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'src/elements/a-steps.*' 'src/elements/a-select*' \
            src/components/{Steps,select-parts}.css \
            'tests/tooltip*' tests/consumers/templates/nextjs/package.json \
            scripts/build-bundle.mjs .github/workflows/{ci,component-tests}.yml \
            'tests/component*.mjs' package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'tooltip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'tooltip=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-input*' 'src/elements/a-button.*' 'src/elements/a-tooltip.*' 'src/elements/a-icon*' \
            'src/elements/a-menu*' 'src/elements/a-calendar.*' 'src/elements/a-select*' \
            src/components/{Input,InputDate,InputAutocomplete,Select,SelectFaceted,Button,Tooltip,Menu,Icon}.tsx \
            src/{jsx-runtime,native-event-props,input-events,anta_helpers,general_types,index,bundle}.ts \
            src/elements/{index,key-activation,shadow-aria,input-focus-modality,input-trailing-actions}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/input-*' tests/consumers/templates/nextjs/package.json \
            scripts/build-bundle.mjs .github/workflows/{ci,component-tests}.yml \
            'tests/component*.mjs' package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'input=true' >> "$GITHUB_OUTPUT"
          else
            echo 'input=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-input*' src/elements/{input-focus-modality,input-trailing-actions,shadow-aria,key-activation,index}.ts \
            'src/elements/a-button.*' 'src/elements/a-icon*' 'src/elements/a-menu*' 'src/elements/a-calendar.*' \
            src/components/{InputTime,Input,InputDate,Button,Icon,Menu,Calendar}.tsx \
            src/{jsx-runtime,native-event-props,input-events,anta_helpers,general_types,index,bundle}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/input-time*' tests/native-event-props.test.mjs tests/consumers/templates/nextjs/package.json \
            'tests/component*.mjs' scripts/build-bundle.mjs .github/workflows/{ci,component-tests}.yml \
            package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'input-time=true' >> "$GITHUB_OUTPUT"
          else
            echo 'input-time=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'src/elements/a-toast*' 'src/elements/a-banner.*' 'src/elements/a-card.*' \
            'src/elements/a-button.*' 'src/elements/a-icon*' 'src/elements/a-input.*' \
            'src/elements/a-title.*' 'src/elements/a-text.*' 'src/elements/a-tooltip.*' \
            src/components/{Toaster,Banner,Card,Button,Icon,Input,Title,Text,Tooltip}.tsx \
            src/{toaster,jsx-runtime,native-event-props,input-events,anta_helpers,general_types,index,bundle}.ts \
            src/elements/{index,input-focus-modality,input-trailing-actions,key-activation,shadow-aria}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            'tests/toaster-*' tests/consumers/templates/nextjs/package.json \
            scripts/build-bundle.mjs .github/workflows/{ci,component-tests}.yml \
            'tests/component*.mjs' package.json pnpm-lock.yaml pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'toaster=true' >> "$GITHUB_OUTPUT"
          else
            echo 'toaster=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Workspace prepare scripts build Anta, stickers, Plot, and the TypeDoc theme on install.
      - name: Install dependencies and build workspace
        run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Run tests
        run: pnpm test
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
          # The debounce case races the browser clock during setup.
          NODE_OPTIONS: >-
            --test-skip-pattern="^debounces typing, keeps previous matches, and shows activity only in the input$"
      - name: Test selected components
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
          COMPONENT_TEST_SELECTION: ${{ toJSON(steps.component-tests.outputs) }}
        run: |
          components=$(node --input-type=module -e '
            import { componentSuites } from "./tests/component-suites.mjs";
            const selection = JSON.parse(process.env.COMPONENT_TEST_SELECTION);
            process.stdout.write(Object.keys(componentSuites)
              .filter(name => selection[name] === "true").join(","));
          ')
          if [ -n "$components" ]; then
            pnpm test:components --component "$components"
          fi

      - name: Typecheck stickers
        run: pnpm --filter @antadesign/stickers run typecheck
      - name: Typecheck plot
        run: pnpm --filter @antadesign/plot run typecheck
      - name: Verify plot package
        run: pnpm --filter @antadesign/plot run check:package
      - name: Verify TypeDoc theme package
        run: pnpm --filter @antadesign/typedoc-theme exec npm pack --dry-run
      - name: Lint site CSS
        run: pnpm --filter anta-site run lint:css
      - name: Typecheck search worker
        run: pnpm --filter anta-site run typecheck:worker
      - name: Build site
        run: pnpm --filter anta-site build
      - name: Test production site
        run: pnpm --filter anta-site test:production
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
