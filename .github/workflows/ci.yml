        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Run tests
        timeout-minutes: 5
        run: pnpm test
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
          # The debounce case races the browser clock during setup.
          NODE_OPTIONS: >-
            --test-skip-pattern="^debounces typing, keeps previous matches, and shows activity only in the input$"
      - name: Test selected components
        timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 25 || 10 }}
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
          COMPONENT_TEST_SELECTION: ${{ toJSON(steps.component-tests.outputs) }}
        run: |
          components=$(node --input-type=module -e '
            import { componentSuites } from "./tests/component-suites.mjs";
            const selection = JSON.parse(process.env.COMPONENT_TEST_SELECTION);
            process.stdout.write(Object.keys(componentSuites)
              .filter(name => selection[name] === "true").join(","));
          ')
          if [ -n "$components" ]; then
            pnpm test:components --component "$components"
          fi

      - name: Typecheck stickers
        run: pnpm --filter @antadesign/stickers run typecheck
      - name: Typecheck plot
        run: pnpm --filter @antadesign/plot run typecheck
      - name: Verify plot package
        run: pnpm --filter @antadesign/plot run check:package
      - name: Verify TypeDoc theme package
        run: pnpm --filter @antadesign/typedoc-theme exec npm pack --dry-run
      - name: Lint site CSS
        run: pnpm --filter anta-site run lint:css
      - name: Typecheck search worker
        run: pnpm --filter anta-site run typecheck:worker
      - name: Build site
        timeout-minutes: 10
        run: pnpm --filter anta-site build
      - name: Test production site
        timeout-minutes: 5
        run: pnpm --filter anta-site test:production
        env:
          CAPTURE_TEST_BROWSER_CHANNEL: chrome
