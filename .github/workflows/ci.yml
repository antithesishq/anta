name: CI
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Install capture-test browser
        run: pnpm --filter anta-site exec playwright install --with-deps chromium
      - name: Test Box input capture
        run: pnpm run test:box-input
      - name: Test Markdown disclosure headings
        run: node --test tests/mdx-disclosures.test.mjs
      - name: Build stickers
        run: pnpm --filter @antadesign/stickers run build
      - name: Typecheck stickers
        run: pnpm --filter @antadesign/stickers run typecheck
      - name: Lint site CSS
        run: pnpm --filter anta-site run lint:css
      - name: Build site
        run: pnpm --filter anta-site build
