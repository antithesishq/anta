name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  docs-review:
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Workspace prepare scripts build Anta, stickers, Plot, and the TypeDoc theme on install.
      - name: Install dependencies and build workspace
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - name: Check documentation authors
        timeout-minutes: 5
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'review-docs') }}
        run: |
          if [ "$DOCS_REVIEWED" = true ]; then
            node scripts/check-doc-review.mjs --base "$DOCS_BASE_SHA" --review-docs
          else
            node scripts/check-doc-review.mjs --base "$DOCS_BASE_SHA"
          fi

  build:
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 45 || 30 }}
    runs-on: ubuntu-latest
    env:
      ANTA_TEST_WEBKIT: '0'
      ANTA_COMPONENT_TEST_TIER: ${{ github.event_name == 'workflow_dispatch' && 'slow' || 'fast' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select component tests
        id: component-tests
        env:
          TEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$TEST_BASE_SHA" ]; then
            echo 'value-ownership=true' >> "$GITHUB_OUTPUT"
            echo 'selection=true' >> "$GITHUB_OUTPUT"
            echo 'plot=true' >> "$GITHUB_OUTPUT"
            echo 'panel=true' >> "$GITHUB_OUTPUT"
            echo 'slider=true' >> "$GITHUB_OUTPUT"
            echo 'input-autocomplete=true' >> "$GITHUB_OUTPUT"
            echo 'select=true' >> "$GITHUB_OUTPUT"
            echo 'dialog=true' >> "$GITHUB_OUTPUT"
            echo 'menu=true' >> "$GITHUB_OUTPUT"
            echo 'copy=true' >> "$GITHUB_OUTPUT"
            echo 'calendar=true' >> "$GITHUB_OUTPUT"
            echo 'card=true' >> "$GITHUB_OUTPUT"
            echo 'stickers=true' >> "$GITHUB_OUTPUT"
            echo 'text=true' >> "$GITHUB_OUTPUT"
            echo 'progress=true' >> "$GITHUB_OUTPUT"
            echo 'expander=true' >> "$GITHUB_OUTPUT"
            echo 'banner=true' >> "$GITHUB_OUTPUT"
            echo 'input-time=true' >> "$GITHUB_OUTPUT"
            echo 'input=true' >> "$GITHUB_OUTPUT"
            echo 'toaster=true' >> "$GITHUB_OUTPUT"
            echo 'tooltip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            src/components/{Input,InputTime,InputDate,InputAutocomplete,Select,SelectFaceted,Checkbox,Switch,Calendar,RadioGroup,Tabs}.tsx \
            'src/elements/a-input*' 'src/elements/a-checkbox.*' 'src/elements/a-switch.*' \
            'src/elements/a-calendar.*' 'src/elements/a-radio*' 'src/elements/a-tab*' \
            src/{anta_helpers,input-events,jsx-runtime,native-event-props,general_types,index,bundle}.ts \
            tests/value-ownership{,-package}.mjs 'tests/component*.mjs' scripts/build-bundle.mjs \
            .github/workflows/{ci,component-tests}.yml package.json pnpm-lock.yaml pnpm-workspace.yaml site/package.json)
          if [ -n "$changed" ]; then
            echo 'value-ownership=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value-ownership=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            'plot/src/**' 'plot/scripts/**' 'plot/tests/**' plot/package.json \
            docs/packages/plot.md 'site/src/content/packages/plot/**' site/src/styles/base.css \
            src/components/{Tooltip,Menu,MenuItem}.tsx 'src/elements/a-box*' 'src/elements/a-capture*' \
            'src/elements/a-tooltip*' 'src/elements/a-menu*' src/box-types.ts src/capture-types.ts \
            src/elements/{capture-input,focus,copy-behavior,key-activation}.ts src/box-observation.ts \
            src/{jsx-runtime,native-event-props,anta_helpers,general_types,index,bundle}.ts \
            src/{tokens,reset,theme-antune,theme-antithesis}.css \
            tests/consumers/templates/nextjs/package.json scripts/build-bundle.mjs \
            'tests/component*.mjs' .github/workflows/{ci,component-tests}.yml \
            package.json pnpm-lock.yaml pnpm-workspace.yaml site/package.json)
          if [ -n "$changed" ]; then
            echo 'plot=true' >> "$GITHUB_OUTPUT"
          else
            echo 'plot=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            src/components/{Calendar,InputDate,RadioGroup,Tabs,TabPanel,Steps,Input,InputTime,Button,Menu,MenuItem,Tooltip,Icon}.tsx \
