            tests/consumers/templates/nextjs/package.json scripts/build-bundle.mjs \
            'tests/component*.mjs' .github/workflows/ci.yml package.json pnpm-lock.yaml \
            pnpm-workspace.yaml {site,plot}/package.json)
          if [ -n "$changed" ]; then
            echo 'selection=true' >> "$GITHUB_OUTPUT"
          else
            echo 'selection=false' >> "$GITHUB_OUTPUT"
          fi
          changed=$(git diff --name-only "$TEST_BASE_SHA"...HEAD -- \
            src/components/Panel.tsx 'src/elements/a-panel.*' \
            'src/elements/a-button.*' 'src/elements/a-icon*' 'src/elements/a-input.*' \
            'src/elements/a-menu*' 'src/elements/a-dialog.*' 'src/elements/a-box.*' 'src/elements/a-capture.*' \
            src/elements/{panel-focus,focus,index,key-activation,shadow-aria,input-focus-modality,input-trailing-actions,copy-behavior,capture-input}.ts \
