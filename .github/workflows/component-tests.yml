name: Component matrix
on:
  workflow_dispatch:
    inputs:
      component:
        description: Component suite
        type: choice
        default: all
        options: [all, banner, calendar, card, expander, progress, text]
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      # Workspace prepare scripts build the packages during installation.
      - name: Install dependencies and build workspace
        run: pnpm install --frozen-lockfile
      - name: Install browser engines
        run: pnpm --filter anta-site exec playwright install --with-deps chromium firefox webkit
      - name: Run full component coverage
        env:
          COMPONENT: ${{ inputs.component }}
        run: pnpm test:components --tier slow --component "$COMPONENT"
      - name: Save Expander visual matrix
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: expander-visual
          path: tests/.test-output/expander
          include-hidden-files: true
          if-no-files-found: ignore
