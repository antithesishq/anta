name: Trigger Cloudflare Pages deployment

# Manual recovery and build logs for Cloudflare Pages.
# Run from the Actions UI: pick a branch, click "Run workflow".
# Deploy mode cancels any in-flight deployment for that branch
# (best-effort) and asks Cloudflare to start a fresh build at the
# branch's current HEAD.
#
# This complements the automatic cleanup workflows — it doesn't run
# on push, it only runs when explicitly invoked.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to inspect or redeploy (e.g. main, anta-button)
        required: true
        type: string
      action:
        description: Redeploy the branch or read its latest build logs
        type: choice
        default: deploy
        options:
          - deploy
          - logs
      node_version:
        description: Optional Node version to set for the target build environment before redeploying
        type: string

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Set the build Node version
        if: inputs.action != 'logs' && inputs.node_version != ''
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: anta
          BRANCH: ${{ inputs.branch }}
          BUILD_NODE_VERSION: ${{ inputs.node_version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          version = os.environ["BUILD_NODE_VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("Use an exact Node version, such as 24.15.0")
          url = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/pages/projects/{os.environ['PROJECT']}"
          headers = {"Authorization": "Bearer " + os.environ["CF_API_TOKEN"], "Content-Type": "application/json"}

          def request(method="GET", payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = json.load(response)
              if not body.get("success"):
                  raise RuntimeError(body.get("errors"))
              return body["result"]

          project = request()
          environment = "production" if os.environ["BRANCH"] == project["production_branch"] else "preview"
          request("PATCH", {"deployment_configs": {environment: {"env_vars": {
              "NODE_VERSION": {"type": "plain_text", "value": version}
          }}}})
          updated = request()["deployment_configs"][environment]["env_vars"]["NODE_VERSION"]["value"]
          if updated != version:
              raise SystemExit("Cloudflare did not retain the requested Node version")
          print(f"Set {environment} build NODE_VERSION to {version}")
          PY

      - name: Read latest deployment logs
        if: inputs.action == 'logs'
        timeout-minutes: 6
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: anta
          BRANCH: ${{ inputs.branch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import uuid

          base = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/pages/projects/{os.environ['PROJECT']}/deployments"
          headers = {"Authorization": "Bearer " + os.environ["CF_API_TOKEN"]}

          def get(suffix):
              request = urllib.request.Request(base + suffix, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if not payload.get("success"):
                  raise RuntimeError(payload.get("errors"))
              return payload["result"]

          page = 1
          deployment = None
          while deployment is None:
              items = get(f"?page={page}&per_page=25")
              deployment = next((item for item in items if item["deployment_trigger"]["metadata"]["branch"] == os.environ["BRANCH"]), None)
              if deployment is not None or len(items) < 25:
                  break
              page += 1
          if deployment is None:
              raise SystemExit("No deployment found for the branch")

          deployment_path = "/" + urllib.parse.quote(deployment["id"], safe="")
          terminal = {"success", "failure", "canceled", "skipped"}
          for attempt in range(24):
              if deployment["latest_stage"]["status"] in terminal:
                  break
              time.sleep(10)
              deployment = get(deployment_path)

          print(json.dumps({key: deployment.get(key) for key in ["id", "build_config", "latest_stage", "deployment_trigger"]}, indent=2))
          logs = get(deployment_path + "/history/logs")
          marker = uuid.uuid4().hex
          print(f"::stop-commands::{marker}")
          for item in logs.get("data", []):
              print(item["line"])
          print(f"::{marker}::")
          PY

      - name: Cancel in-flight deployments and trigger fresh build
        if: inputs.action != 'logs'
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: anta
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments"

          echo "Branch: ${BRANCH}"
          echo

          # Find any deployment for the branch that hasn't reached a
          # terminal state. Cloudflare's `latest_stage.status` values
          # we treat as terminal: success, failure, canceled, skipped.
          # Anything else (idle, active, etc.) is in-flight.
          echo "Scanning for in-flight deployments…"
          PAGE_SIZE=25
          stuck_ids=""
          page=1
          while :; do
            res=$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" \
              "${api}?page=${page}&per_page=${PAGE_SIZE}")
            success=$(echo "${res}" | jq -r '.success')
            if [[ "${success}" != "true" ]]; then
              echo "List API error:"
              echo "${res}" | jq '.errors // .'
              exit 1
            fi

            page_ids=$(echo "${res}" | jq -r --arg b "${BRANCH}" '
              .result[]
              | select(.deployment_trigger.metadata.branch == $b)
              | (.latest_stage.status // "unknown") as $s
              | select($s != "success" and $s != "failure" and $s != "canceled" and $s != "skipped")
              | .id
            ')
            if [[ -n "${page_ids}" ]]; then
              stuck_ids+="${page_ids}"$'\n'
            fi

            page_count=$(echo "${res}" | jq -r '.result | length')
            if [[ "${page_count}" -lt "${PAGE_SIZE}" ]]; then
              break
            fi
            page=$((page + 1))
          done

          stuck_ids=$(printf '%s' "${stuck_ids}" | sed '/^$/d')
          if [[ -n "${stuck_ids}" ]]; then
            count=$(echo "${stuck_ids}" | wc -l | tr -d ' ')
            echo "Cancelling ${count} in-flight deployment(s) (best-effort)…"
            # Cloudflare's Pages API has no dedicated cancel endpoint;
            # DELETE with force=true is the closest available. A genuinely
            # mid-build deploy may still finish in the background — that's
            # OK, the next scheduled cleanup will reap it.
            while IFS= read -r id; do
              echo "  ${id}"
              res=$(curl -sS -X DELETE \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                "${api}/${id}?force=true") || true
              ok=$(echo "${res}" | jq -r '.success // false')
              if [[ "${ok}" != "true" ]]; then
                echo "    (delete returned non-success; continuing)"
                echo "${res}" | jq -c '.errors // .' || true
              fi
            done <<< "${stuck_ids}"
            echo
          else
            echo "No in-flight deployments for ${BRANCH}."
            echo
          fi

          # Trigger a fresh deployment from the branch HEAD.
          echo "Triggering new deployment for ${BRANCH}…"
          res=$(curl -sS -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -F "branch=${BRANCH}" \
            "${api}")

          success=$(echo "${res}" | jq -r '.success')
          if [[ "${success}" != "true" ]]; then
            echo "Failed to trigger deployment:"
            echo "${res}" | jq '.errors // .'
            exit 1
          fi

          new_id=$(echo "${res}" | jq -r '.result.id')
          new_url=$(echo "${res}" | jq -r '.result.url')
          new_alias=$(echo "${res}" | jq -r '.result.aliases[0] // empty')

          echo "✓ Deployment ${new_id} created"
          echo "  Preview URL : ${new_url}"
          if [[ -n "${new_alias}" ]]; then
            echo "  Branch alias: ${new_alias}"
          fi
